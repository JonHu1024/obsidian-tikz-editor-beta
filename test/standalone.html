<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>TikZ Editor — standalone test (real TikZJax engine)</title>
  <style>
    :root {
      --background-primary: #ffffff;
      --background-secondary: #f2f2f2;
      --background-secondary-alt: #e8e8e8;
      --background-modifier-border: #d0d0d0;
      --background-modifier-hover: #e6e6e6;
      --background-modifier-error: #ffebeb;
      --text-normal: #222222;
      --text-muted: #666666;
      --text-faint: #999999;
      --text-accent: #7c8cff;
      --text-on-accent: #ffffff;
      --text-error: #e03030;
      --interactive-accent: #7c8cff;
      --font-monospace: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --color-red: #e03030;
      --color-purple: #8a2be2;
      --color-orange: #ff8c00;
      --color-green: #008000;
    }
    html, body { height: 100%; margin: 0; }
    #root { height: 100%; }
    .note {
      position: fixed;
      bottom: 8px;
      right: 12px;
      z-index: 500;
      font: 12px/1.5 var(--font-monospace);
      color: var(--text-muted);
      background: rgba(255,255,255,0.85);
      border: 1px solid var(--background-modifier-border);
      border-radius: 6px;
      padding: 6px 10px;
      max-width: 320px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div class="note">
    Standalone test page — real TikZJax engine, 1:1 with Obsidian.
    首次使用: 预览区点击 Download TeX core (~10MB, 一次性).
    快捷键: t/s/a 创建, i 编辑, Alt 退出, Alt+E 回 NORMAL, ok 输出代码(控制台).
  </div>
  <script src="./standalone.js"></script>
</body>
</html>
