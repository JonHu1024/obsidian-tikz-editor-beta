<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TikZ Editor harness</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    :root {
      --background-primary: #ffffff;
      --background-secondary: #f5f5f5;
      --background-secondary-alt: #ebebeb;
      --background-modifier-border: #d0d0d0;
      --background-modifier-hover: #e8e8e8;
      --background-modifier-error: #ffebeb;
      --text-normal: #222222;
      --text-muted: #666666;
      --text-faint: #999999;
      --text-accent: #7c8cff;
      --text-on-accent: #ffffff;
      --text-error: #e03030;
      --interactive-accent: #7c8cff;
      --font-monospace: ui-monospace, monospace;
      --color-red: #e03030;
      --color-purple: #8a2be2;
      --color-orange: #ff8c00;
      --color-green: #008000;
    }
    html, body { height: 100%; margin: 0; }
    #root { height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./harness.js"></script>
</body>
</html>
